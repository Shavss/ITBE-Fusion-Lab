<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TBE Fusion Lab</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #111;
    }
    h1 {
      margin-bottom: 0.4rem;
    }
    p {
      font-size: 1.05rem;
    }
    .actions {
      margin: 24px 0;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .button {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 10px;
      text-decoration: none;
      border: 1px solid #ccc;
      color: #111;
      font-weight: 600;
    }
    .button:hover {
      background: #f5f5f5;
    }
    .video {
      margin-top: 24px;
      aspect-ratio: 16 / 9;
      width: 100%;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <h1>TBE Fusion Lab</h1>
  <p>
    Full-stack web application developed for TU Munich’s Fusion Lab, enabling
    interactive integration and 3D visualisation of building performance and
    IFC/BIM data using React, Node.js/Express, IFC.js, Three.js, and Azure.
  </p>

  <div class="actions">
    <a
      class="button"
      href="https://github.com/Shavss/ITBE-Fusion-Lab"
      target="_blank"
      rel="noopener noreferrer"
    >
      View GitHub Repository
    </a>
  </div>

  <div class="video">
    <iframe
      src="https://vimeo.com/1175405454?share=copy&fl=sv&fe=ci"
      allow="autoplay; fullscreen; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>
</body>
</html>
