# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - Fusionlab2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://index.docker.io/v1/
        username: ${{ secrets.AzureAppService_ContainerUsername_d5b152c60d2749879c65468d446ab616 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_c32a6c58731b4ea2ba9e5453c93a642a }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: index.docker.io/${{ secrets.AzureAppService_ContainerUsername_d5b152c60d2749879c65468d446ab616 }}/shavss/fusionlab-backend:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'Fusionlab2'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_990b5afb7adb4393aab8d900cfc4ced8 }}
        images: 'index.docker.io/${{ secrets.AzureAppService_ContainerUsername_d5b152c60d2749879c65468d446ab616 }}/shavss/fusionlab-backend:${{ github.sha }}'