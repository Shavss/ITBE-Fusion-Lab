# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - Fusionlab2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1) Check out your code
      - uses: actions/checkout@v4

      # 2) Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 3) Log in to Docker Hub (or your chosen registry)
      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: https://index.docker.io/v1/
          username: ${{ secrets.AzureAppService_ContainerUsername_d4f1baaa870c4bc28a414b8dde3e7ace }}
          password: ${{ secrets.AzureAppService_ContainerPassword_aac347f038b84575a8ab50e6aba181e5 }}

      # 4) Build and push the container image
      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          # Make the backend/ folder your build context.
          context: ./backend
          # The path to your Dockerfile is also in backend/.
          file: ./backend/Dockerfile
          push: true
          # Tag format: index.docker.io/<username>/fusionlab-backend:<commitSha>
          tags: index.docker.io/${{ secrets.AzureAppService_ContainerUsername_d4f1baaa870c4bc28a414b8dde3e7ace }}/fusionlab-backend:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'Fusionlab2'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_e01ce61c47754485a977b0c4d57622ec }}
          # Must match the same image name + tag used in the build step:
          images: 'index.docker.io/${{ secrets.AzureAppService_ContainerUsername_d4f1baaa870c4bc28a414b8dde3e7ace }}/fusionlab-backend:${{ github.sha }}'
