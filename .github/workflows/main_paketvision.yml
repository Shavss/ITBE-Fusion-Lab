name: Build and deploy container app to Azure Web App - paketvision

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://index.docker.io/v1/
        username: ${{ secrets.AzureAppService_ContainerUsername_dcb27323ffce4478af90e385f9614f8e }}
        password: ${{ secrets.AzureAppService_ContainerPassword_79b2f52e0fe04ea6919344d6a507f5e9 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        context: ./test-project  # Ensure the frontend is built from the test-project folder
        tags: index.docker.io/${{ secrets.AzureAppService_ContainerUsername_dcb27323ffce4478af90e385f9614f8e }}/fusionlab-frontend:latest  # Use latest tag
        file: ./test-project/Dockerfile  # Dockerfile is in the test-project folder
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'paketvision'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_165c30ef7e2c40e7a587c8e2716b2b1d }}
        images: 'index.docker.io/${{ secrets.AzureAppService_ContainerUsername_dcb27323ffce4478af90e385f9614f8e }}/fusionlab-frontend:latest'  # Use latest tag for deployment
