services:
  frontend:
    build:
      context: ./test-project
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://paketvision-d7bfakgjd3fgazfs.germanywestcentral-01.azurewebsites.net  # Correct frontend URL
        VITE_BACKEND_URL: https://fusionlab2-d0fddybseka5awea.germanywestcentral-01.azurewebsites.net  # Added backend URL
    ports:
      - "5001:80"  # Maps port 5001 on your machine to port 80 in the container
    environment:
      - VITE_API_BASE_URL=https://paketvision-d7bfakgjd3fgazfs.germanywestcentral-01.azurewebsites.net  # Correct frontend link
      - VITE_BACKEND_URL=https://fusionlab2-d0fddybseka5awea.germanywestcentral-01.azurewebsites.net  # Added backend link

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo

  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: