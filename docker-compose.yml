services:
  frontend:
    build:
      context: ./test-project
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://fusionlab2-d0fddybseka5awea.germanywestcentral-01.azurewebsites.net  # Pass the environment variable during build
    ports:
      - "5001:80"
    environment:
      - VITE_API_BASE_URL=https://fusionlab2-d0fddybseka5awea.germanywestcentral-01.azurewebsites.net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo

  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
