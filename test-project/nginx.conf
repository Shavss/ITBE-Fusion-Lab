# nginx.conf for React Frontend with External Backend
server {
    listen 80;
    server_name localhost;

    # Serve React Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri /index.html;
    }

    # Proxy API Requests
    location /api/ {
        proxy_pass https://fusionlab2-d0fddybseka5awea.germanywestcentral-01.azurewebsites.net;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy HTTP iframe Request (Allow Mixed Content)
    location /3dwebclient/ {
        proxy_pass http://ppaiasok.eastus.azurecontainer.io:8000/3dwebclient/; # Use HTTP since container doesn't have HTTPS

        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow Cross-Origin Requests
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';

        # Allow Mixed Content for Iframe
        add_header Content-Security-Policy "frame-ancestors *; upgrade-insecure-requests" always;
        add_header X-Frame-Options "ALLOWALL";

        # Handle OPTIONS requests (Preflight for CORS)
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
